[package]
name = "cliphist-secure"
version = "0.2.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "cliphist"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.10"
unicode-segmentation = "1.12"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.20"
