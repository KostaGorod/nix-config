name: Update Dependency Pins

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve and show the update diff without committing anything
        type: boolean
        required: true
        default: true

concurrency:
  group: update-dependency-pins
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    if: github.repository == 'KostaGorod/nix-config'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate updater syntax
        run: bash -n scripts/update-orca-ide.sh scripts/update-pins.sh

      - name: Resolve reviewed Orca metadata
        id: orca
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          scripts/update-orca-ide.sh --check --json >"${RUNNER_TEMP}/orca-check.json"
          jq -e '.schema == 1 and .mode == "check"' "${RUNNER_TEMP}/orca-check.json" >/dev/null
          {
            printf 'available=%s\n' "$(jq -r '.available' "${RUNNER_TEMP}/orca-check.json")"
            printf 'old_version=%s\n' "$(jq -r '.current.version' "${RUNNER_TEMP}/orca-check.json")"
            printf 'new_version=%s\n' "$(jq -r '.candidate.version' "${RUNNER_TEMP}/orca-check.json")"
            printf 'release_url=%s\n' "$(jq -r '.candidate.release_url' "${RUNNER_TEMP}/orca-check.json")"
            printf 'asset_digest=%s\n' "$(jq -r '.candidate.api_digest' "${RUNNER_TEMP}/orca-check.json")"
          } >>"${GITHUB_OUTPUT}"

      - name: Prepare reviewed pin update
        id: update
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          GITHUB_TOKEN: ${{ github.token }}
          ORCA_AVAILABLE: ${{ steps.orca.outputs.available }}
          ORCA_OLD_VERSION: ${{ steps.orca.outputs.old_version }}
          ORCA_NEW_VERSION: ${{ steps.orca.outputs.new_version }}
          ORCA_RELEASE_URL: ${{ steps.orca.outputs.release_url }}
          ORCA_ASSET_DIGEST: ${{ steps.orca.outputs.asset_digest }}
        run: |
          set -Eeuo pipefail
          args=(--apply --json)
          if [[ "${ORCA_AVAILABLE}" == true ]]; then
            args+=(--orca-version "${ORCA_NEW_VERSION}" --orca-asset-digest "${ORCA_ASSET_DIGEST}")
          fi

          scripts/update-pins.sh "${args[@]}" >"${RUNNER_TEMP}/update-pins.json"
          jq -e '.schema == 1 and .mode == "apply"' "${RUNNER_TEMP}/update-pins.json" >/dev/null

          mapfile -t changed < <(git diff --name-only --)
          for path in "${changed[@]}"; do
            case "${path}" in
              flake.lock|packages/orca-ide/default.nix) ;;
              *) printf 'Unexpected changed path: %s\n' "${path}" >&2; exit 1 ;;
            esac
          done
          git diff --check

          has_changes=false
          if ! git diff --quiet --; then has_changes=true; fi
          {
            printf 'has_changes=%s\n' "${has_changes}"
            printf 'dry_run=%s\n' "${DRY_RUN}"
          } >>"${GITHUB_OUTPUT}"

          warning="$(jq -r '.orca.check.provenance_warning' "${RUNNER_TEMP}/update-pins.json")"
          printf '%s\n' '### Dependency pin update' >>"${GITHUB_STEP_SUMMARY}"
          printf '%s\n' '' "- Dry run: \`${DRY_RUN}\`" \
            "- Orca: \`${ORCA_OLD_VERSION}\` → \`${ORCA_NEW_VERSION}\`" \
            "- Release: ${ORCA_RELEASE_URL}" \
            "- Asset digest: \`${ORCA_ASSET_DIGEST}\`" \
            "- Warning: ${warning}" '' '```diff' >>"${GITHUB_STEP_SUMMARY}"
          git diff -- >>"${GITHUB_STEP_SUMMARY}"
          printf '%s\n' '```' >>"${GITHUB_STEP_SUMMARY}"
          git diff --

      - name: No update required
        if: steps.update.outputs.has_changes != 'true'
        run: printf '%s\n' 'No dependency pin changes were resolved.'

      - name: Validate pins before commit
        if: steps.update.outputs.has_changes == 'true'
        run: |
          set -Eeuo pipefail
          nix flake check --no-build --show-trace
          nix build .#checks.x86_64-linux.rocinante-toplevel --print-build-logs

      - name: Commit update to main
        if: steps.update.outputs.has_changes == 'true' && steps.update.outputs.dry_run != 'true'
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- flake.lock packages/orca-ide/default.nix
          git commit -m 'chore: update dependency pins'
          git push origin "HEAD:refs/heads/main"
