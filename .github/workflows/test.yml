name: Nix Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: nix-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate updater shell syntax
        run: bash -n scripts/update-orca-ide.sh scripts/update-pins.sh

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake check (eval + treefmt)
        run: nix flake check --show-trace

      - name: Build rocinante
        run: nix build .#checks.x86_64-linux.rocinante-toplevel --print-build-logs

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify treefmt
        run: nix build .#checks.x86_64-linux.treefmt --print-build-logs
